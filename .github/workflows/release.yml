name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist as a git tag).'
        required: true
        type: string

permissions:
  contents: write       # for creating the GitHub Release
  packages: write       # for pushing to GHCR
  id-token: write       # for OIDC-signed provenance / sigstore attestations
  attestations: write   # for build provenance attestations

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.tag }}"
          else
            ref="${{ github.ref_name }}"
          fi
          echo "name=${ref}" >> "$GITHUB_OUTPUT"
          echo "Will release: ${ref}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=UniFi Video Controller (modernized)
            org.opencontainers.image.version=${{ steps.tag.outputs.name }}

      # Push only (no load:) -- provenance + SBOM attestations produce a
      # multi-platform manifest list that the docker exporter cannot load
      # locally. We pull the image back in the next step for tar export.
      - name: build + push GHCR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: pull pushed image for tar export
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
          docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
          format: spdx-json
          output-file: image.spdx.json

      - name: save image to tar
        run: |
          docker save \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }} \
            -o image.tar
          ls -lh image.tar

      - name: compress (gzip -9)
        run: |
          gzip -9 image.tar
          ls -lh image.tar.gz

      - name: generate release SHA256SUMS
        run: |
          sha256sum image.tar.gz image.spdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            image.tar.gz
            image.spdx.json
            SHA256SUMS.txt
