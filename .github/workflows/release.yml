name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist as a git tag).'
        required: true
        type: string

permissions:
  contents: write       # for creating the GitHub Release
  packages: write       # for pushing to GHCR
  id-token: write       # for OIDC-signed provenance / sigstore attestations
  attestations: write   # for build provenance attestations

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.tag }}"
          else
            ref="${{ github.ref_name }}"
          fi
          echo "name=${ref}" >> "$GITHUB_OUTPUT"
          echo "Will release: ${ref}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action has TWO independent input lists:
      #   - labels:      drives image-config labels (visible via `docker inspect`).
      #                  User-supplied values overwrite the auto-generated GitHub
      #                  defaults (repo name/description/etc.).
      #   - annotations: drives OCI manifest annotations (what the GHCR package
      #                  page renders).  Does NOT inherit from labels: -- if this
      #                  block is omitted, the annotations output falls back to
      #                  the auto-generated GitHub defaults (repo name as title,
      #                  repo description as description, etc.).  Empirically
      #                  verified in the v3.10.13-20 release log: labels: was
      #                  honoured but annotations: was absent, so the manifest
      #                  carried defaults like
      #                  "Docker for Unifi-Video Controller (Ubiquiti Networks)"
      #                  instead of our custom description.  v3.10.13-21 adds
      #                  the explicit annotations: block to fix this.
      #
      # DOCKER_METADATA_ANNOTATIONS_LEVELS=manifest,index pushes the generated
      # annotations to BOTH the per-platform image manifest AND the multi-arch
      # image index.  GHCR's package UI reads from the index for multi-arch
      # images, which our provenance + SBOM attestations produce (the build
      # output is an OCI image index, not a single manifest).  Default of
      # "manifest" alone is insufficient -- the index would carry no
      # description and the UI would still show "no description".
      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=UniFi Video Controller (modernized)
            org.opencontainers.image.description=UniFi Video 3.10.13 on Ubuntu 24.04 + OpenJDK 21 LTS + MongoDB 4.4 (with 4.0->4.2->4.4 fCV migration); airvision identifier rewrite + Tomcat 9 Bootstrap shim applied at runtime by uv-patcher
            org.opencontainers.image.version=${{ steps.tag.outputs.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=conmilo
          annotations: |
            org.opencontainers.image.title=UniFi Video Controller (modernized)
            org.opencontainers.image.description=UniFi Video 3.10.13 on Ubuntu 24.04 + OpenJDK 21 LTS + MongoDB 4.4 (with 4.0->4.2->4.4 fCV migration); airvision identifier rewrite + Tomcat 9 Bootstrap shim applied at runtime by uv-patcher
            org.opencontainers.image.version=${{ steps.tag.outputs.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=conmilo

      # Push only (no load:) -- provenance + SBOM attestations produce a
      # multi-platform manifest list that the docker exporter cannot load
      # locally. We pull the image back in the next step for tar export.
      - name: build + push GHCR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: pull pushed image for tar export
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
          docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
          format: spdx-json
          output-file: image.spdx.json

      - name: save image to tar
        run: |
          docker save \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }} \
            -o image.tar
          ls -lh image.tar

      - name: compress (gzip -9)
        run: |
          gzip -9 image.tar
          ls -lh image.tar.gz

      - name: generate release SHA256SUMS
        run: |
          sha256sum image.tar.gz image.spdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            image.tar.gz
            image.spdx.json
            SHA256SUMS.txt
