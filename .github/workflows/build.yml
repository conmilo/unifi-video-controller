name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  schedule:
    # Weekly verification that the pinned base image still builds cleanly
    # under buildkit. Doesn't publish anything.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  build-and-scan:
    name: build + trivy
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: build (load locally)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: image listing
        run: docker images local:test

      # Comprehensive scan for the Security tab. Includes both OS packages
      # and bundled libraries (Java JARs inside the EOL UniFi Video .deb).
      # Never fails CI -- the gate below decides what blocks a merge.
      # Honours .trivyignore (false-positives where Trivy doesn't see
      # Canonical's CVE backports to focal libssl1.1).
      - name: trivy scan (report-all -> SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local:test
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore
          exit-code: '0'

      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # CI-blocking gate: fails on any fixable HIGH/CRITICAL CVE across both
      # OS packages AND bundled libraries.  Phase 3 (v3.10.13-13) closed the
      # last library CVE and introduced the uv-patcher runtime tool that lets
      # bundled-JAR bumps follow the normal in-place pattern, so future
      # bundled-JAR HIGH/CRITICAL findings are now actionable -- block merges
      # until they're bumped, removed, mitigated, or explicitly added to
      # .trivyignore with documented rationale.  This is the durable
      # mechanism that prevents the hardening pass from rotting over time.
      - name: trivy gate (fail on fixable HIGH/CRITICAL, os + library)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore
          exit-code: '1'
          format: table
